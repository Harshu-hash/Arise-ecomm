openapi: 3.1.0
info:
  title: Arise Seller API
  version: 2.0.0-backend-ready
  description: Complete seller client surface from S1 through S18. All timestamps are UTC, money is integer paise and all IDs are opaque.
servers:
  - url: /api/seller/v1
security:
  - bearerAuth: []
paths:
  /onboarding:
    get:
      deprecated: true
      description: Legacy compatibility only; the seller UI uses public three-step registration.
      operationId: getSellerApplication
      x-permission: onboarding.application.view
      responses:
        {
          '200': { $ref: '#/components/responses/Application' },
          '400': { $ref: '#/components/responses/Error' },
        }
    patch:
      deprecated: true
      description: Legacy compatibility only; the seller UI uses public three-step registration.
      operationId: saveSellerApplicationSection
      x-idempotent: true
      x-permission: onboarding.application.edit
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { type: object, additionalProperties: true } } },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/Application' },
          '400': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /onboarding/submit:
    post:
      deprecated: true
      description: Legacy compatibility only; POST /auth/register now submits the application.
      operationId: submitSellerApplication
      x-permission: onboarding.application.submit
      x-idempotent: true
      responses:
        {
          '200': { description: Submitted },
          '400': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /onboarding/status:
    get:
      deprecated: true
      description: Legacy compatibility only; pending state is returned by registration/login.
      operationId: getSellerApplicationStatus
      x-permission: onboarding.application.view
      responses:
        {
          '200': { $ref: '#/components/responses/Application' },
          '404': { $ref: '#/components/responses/Error' },
        }
  /onboarding/sections/{sectionKey}/resubmit:
    parameters: [{ name: sectionKey, in: path, required: true, schema: { type: string } }]
    post:
      deprecated: true
      operationId: resubmitSellerApplicationSection
      x-permission: onboarding.application.resubmit
      x-idempotent: true
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          documents:
                            {
                              type: object,
                              additionalProperties: { $ref: '#/components/schemas/MediaReference' },
                            },
                        },
                    },
                },
            },
        }
      responses:
        {
          '200': { $ref: '#/components/responses/Application' },
          '400': { $ref: '#/components/responses/Error' },
        }
  /onboarding/agreement:
    get:
      deprecated: true
      operationId: getCurrentSellerAgreement
      x-permission: onboarding.agreement.view
      responses: { '200': { description: Current versioned agreement } }
  /onboarding/agreement/accept:
    post:
      deprecated: true
      operationId: acceptSellerAgreement
      x-permission: onboarding.agreement.accept
      x-idempotent: true
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [version],
                      properties: { version: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          '200': { description: Immutable acceptance receipt },
          '409': { $ref: '#/components/responses/Error' },
        }
  /onboarding/pincode/{pincode}:
    parameters:
      [{ name: pincode, in: path, required: true, schema: { type: string, pattern: '^\\d{6}$' } }]
    get:
      deprecated: true
      operationId: checkPickupPincode
      x-permission: onboarding.application.edit
      responses:
        {
          '200': { description: Pickup serviceability },
          '400': { $ref: '#/components/responses/Error' },
        }
  /settings/profile/change-requests:
    post:
      operationId: requestVerifiedIdentityChange
      x-idempotent: true
      x-permission: onboarding.change_request.create
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: '#/components/schemas/VerifiedChangeRequest' } },
            },
        }
      responses:
        { '200': { description: Change request }, '422': { $ref: '#/components/responses/Error' } }
  /settings/profile/documents/{documentId}/renew:
    parameters: [{ name: documentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: renewVerifiedDocument
      x-idempotent: true
      x-permission: onboarding.document.replace
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [mediaId],
                      properties:
                        {
                          mediaId: { type: string },
                          expiresAt: { type: [string, 'null'], format: date-time },
                        },
                    },
                },
            },
        }
      responses:
        {
          '200': { description: Pending replacement document },
          '404': { $ref: '#/components/responses/Error' },
        }
  /media/uploads:
    post:
      operationId: createMediaUpload
      x-idempotent: true
      x-permission: media.upload.create
      x-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMediaUpload' }
      responses:
        '201': { $ref: '#/components/responses/UploadCreated' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /media/uploads/{uploadId}/content:
    parameters: [{ $ref: '#/components/parameters/UploadId' }]
    put:
      operationId: putMediaContent
      x-permission: media.upload.create
      x-idempotent: true
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '200': { description: Uploaded }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /media/uploads/{uploadId}/complete:
    parameters: [{ $ref: '#/components/parameters/UploadId' }]
    post:
      operationId: completeMediaUpload
      x-permission: media.upload.create
      x-idempotent: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { width: { type: integer }, height: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /media/uploads/{uploadId}:
    parameters: [{ $ref: '#/components/parameters/UploadId' }]
    delete:
      operationId: abortMediaUpload
      x-permission: media.upload.create
      x-idempotent: true
      responses:
        '200': { description: Aborted }
        '404': { $ref: '#/components/responses/Error' }
  /media/{mediaId}:
    parameters: [{ $ref: '#/components/parameters/MediaId' }]
    get:
      operationId: getMedia
      x-permission: media.media.view
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMediaPresentation
      x-idempotent: true
      x-permission: media.upload.create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                crop: { $ref: '#/components/schemas/Crop' }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMedia
      x-permission: media.upload.delete
      x-idempotent: true
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /exports:
    post:
      operationId: createExportJob
      x-idempotent: true
      x-permission: exports.job.create
      x-idempotency-required: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExport' }
      responses:
        '201': { $ref: '#/components/responses/Job' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listSellerJobs
      x-permission: exports.job.view
      responses:
        '200':
          description: Seller-scoped jobs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { type: array, items: { $ref: '#/components/schemas/Job' } } }
        '403': { $ref: '#/components/responses/Error' }
  /jobs/{jobId}:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSellerJob
      x-permission: exports.job.view
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '404': { $ref: '#/components/responses/Error' }
  /saved-views:
    get:
      operationId: listSavedViews
      x-permission: dashboard.dashboard.view
      parameters: [{ name: tableId, in: query, schema: { type: string } }]
      responses: { '200': { description: Saved views } }
    post:
      operationId: createSavedView
      x-permission: dashboard.dashboard.view
      x-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableId, name, state]
              properties:
                {
                  tableId: { type: string },
                  name: { type: string, maxLength: 80 },
                  state: { type: object, additionalProperties: true },
                }
      responses:
        '201': { description: Saved view }
        '422': { $ref: '#/components/responses/Error' }
  /saved-views/{viewId}:
    parameters: [{ name: viewId, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: deleteSavedView
      x-permission: dashboard.dashboard.view
      x-idempotent: true
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /catalog/search:
    get:
      operationId: searchSellerCatalogue
      x-permission: catalog.product.view
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: brandId, in: query, schema: { type: string } }
      responses:
        '200': { description: Customer-visible canonical product matches }
  /catalog/products/{productId}:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSellableCatalogueProduct
      x-permission: catalog.product.view
      responses:
        '200': { description: Canonical product and variants }
        '404': { $ref: '#/components/responses/Error' }
  /catalog/products/{productId}/offers:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: attachSellerOffers
      x-idempotent: true
      x-permission: listings.offer.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offers]
              properties:
                fulfillmentType: { type: string, enum: [SELLER, ARISE] }
                offers:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/OfferInput' }
      responses:
        '201': { description: Seller offers created; canonical content unchanged }
        '409': { $ref: '#/components/responses/Error' }
  /listings/{listingId}:
    parameters: [{ name: listingId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSellerListing
      x-permission: listings.product.view
      responses:
        '200': { description: Offer, canonical content, quality, revision and preview projection }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: proposeSellerContentUpdate
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Updated pre-live content or pending live revision }
        '400': { $ref: '#/components/responses/Error' }
  /listings/{listingId}/variant:
    parameters: [{ name: listingId, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: updateSellerVariant
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses: { '200': { description: Updated variant and offer projection } }
  /listings/{listingId}/price:
    parameters: [{ name: listingId, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: scheduleSellerPrice
      x-idempotent: true
      x-permission: listings.price.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellingPricePaise]
              properties:
                sellingPricePaise: { type: integer, minimum: 1 }
                mrpPaise: { type: integer, minimum: 1 }
                scheduledAt: { type: string, format: date-time }
      responses:
        '200': { description: Immediate or scheduled price }
        '422': { $ref: '#/components/responses/Error' }
  /listings/{listingId}/preview:
    parameters: [{ name: listingId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: previewSellerListingAsCustomer
      x-permission: listings.product.view
      responses: { '200': { description: Customer-shaped product projection } }
  /listings/{listingId}/{action}:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
      - {
          name: action,
          in: path,
          required: true,
          schema: { type: string, enum: [activate, deactivate, archive, relist, delete, resubmit] },
        }
    post:
      operationId: transitionSellerOffer
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        content:
          {
            application/json:
              { schema: { type: object, properties: { reason: { type: string } } } },
          }
      responses:
        '200': { description: Transitioned seller offer; canonical product preserved }
        '409': { $ref: '#/components/responses/Error' }
  /listings/fee-preview:
    post:
      operationId: previewSellerFees
      x-idempotent: true
      x-permission: listings.price.edit
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses: { '200': { description: Commission, fees, net, margin and buy-box context } }
  /listings/bulk-jobs/template:
    get:
      operationId: getSellerBulkTemplate
      x-permission: listings.product.edit
      parameters:
        - {
            name: operation,
            in: query,
            required: true,
            schema: { $ref: '#/components/schemas/BulkOperation' },
          }
        - { name: categoryId, in: query, schema: { type: string } }
      responses: { '200': { description: Operation-specific columns and sample } }
  /listings/bulk-jobs/preflight:
    post:
      operationId: preflightSellerBulkJob
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkRequest' } } }
      responses: { '200': { description: Per-row errors and warnings without writes } }
  /listings/bulk-jobs:
    get:
      operationId: listSellerBulkJobs
      x-permission: listings.product.view
      responses: { '200': { description: Seller-owned catalogue jobs } }
    post:
      operationId: createSellerBulkJob
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BulkRequest' } } }
      responses: { '201': { description: Completed job and per-row results } }
  /listings/bulk-jobs/{jobId}:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getSellerBulkJob
      x-permission: listings.product.view
      responses:
        '200': { description: Seller bulk job }
        '404': { $ref: '#/components/responses/Error' }
  /listings/bulk-jobs/{jobId}/retry:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: retrySellerBulkJobFailures
      x-idempotent: true
      x-permission: listings.product.edit
      requestBody:
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    properties:
                      {
                        rows: { type: array, items: { type: object, additionalProperties: true } },
                      },
                  },
              },
          }
      responses:
        '201': { description: Child retry job }
        '400': { $ref: '#/components/responses/Error' }
  /orders/processing:
    get:
      operationId: getSellerDispatchQueue
      x-permission: logistics.shipment.view
      parameters:
        - {
            name: queue,
            in: query,
            schema: { type: string, enum: [ALL, ACCEPTANCE, PICK, PACK, HANDOVER, OVERDUE] },
          }
        - { name: fulfillmentType, in: query, schema: { type: string, enum: [SELLER, ARISE] } }
      responses: { '200': { description: Seller-scoped dispatch work queue } }
  /orders/{shipmentId}/packages:
    parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: recordSellerShipmentPackages
      x-idempotent: true
      x-permission: logistics.shipment.pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packages]
              properties:
                packages:
                  { type: array, minItems: 1, items: { $ref: '#/components/schemas/PackageInput' } }
      responses:
        '200': { description: Package composition and actual measurements }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{shipmentId}/split:
    parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: splitSellerShipment
      x-idempotent: true
      x-permission: logistics.shipment.pack
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [itemIds],
                    properties: { itemIds: { type: array, minItems: 1, items: { type: string } } },
                  },
              },
          }
      responses:
        '201': { description: Child shipment for partial fulfilment }
        '409': { $ref: '#/components/responses/Error' }
  /orders/{shipmentId}/scan:
    parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: recordSellerFulfilmentScan
      x-idempotent: true
      x-permission: logistics.shipment.pack
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [barcode, purpose],
                    properties:
                      {
                        barcode: { type: string },
                        purpose: { type: string, enum: [PACK, HANDOVER] },
                      },
                  },
              },
          }
      responses:
        '201': { description: Immutable fulfilment scan }
        '400': { $ref: '#/components/responses/Error' }
  /orders/{shipmentId}/documents:
    parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: listSellerFulfilmentDocuments
      x-permission: logistics.document.view
      responses: { '200': { description: Versioned fulfilment documents } }
  /orders/{shipmentId}/documents/{type}:
    parameters:
      - { name: shipmentId, in: path, required: true, schema: { type: string } }
      - {
          name: type,
          in: path,
          required: true,
          schema: { type: string, enum: [TAX_INVOICE, PACKING_SLIP, SHIPPING_LABEL, MANIFEST] },
        }
    post:
      operationId: generateSellerFulfilmentDocument
      x-idempotent: true
      x-permission: logistics.document.generate
      responses:
        '201': { description: Immutable server-generated document artifact }
        '409': { $ref: '#/components/responses/Error' }
  /logistics/documents/{documentId}/download:
    parameters: [{ name: documentId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: downloadSellerFulfilmentDocument
      x-permission: logistics.document.view
      responses:
        '200':
          {
            description: PDF artifact,
            content: { application/pdf: { schema: { type: string, format: binary } } },
          }
        '404': { $ref: '#/components/responses/Error' }
  /logistics/batch:
    post:
      operationId: executeSellerLogisticsBatch
      x-idempotent: true
      x-permission: logistics.shipment.handover
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/LogisticsBatchRequest' } } }
      responses: { '200': { description: Per-shipment success and failure results } }
  /logistics/shipments:
    get:
      operationId: listSellerShipments
      x-permission: logistics.shipment.view
      responses: { '200': { description: Seller-scoped shipments and courier scans } }
  /logistics/pickups:
    get:
      operationId: listSellerPickups
      x-permission: logistics.pickup.view
      responses: { '200': { description: Seller manifests and pickup attempts } }
  /logistics/pickups/{manifestId}/reschedule:
    parameters: [{ name: manifestId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: rescheduleSellerPickup
      x-idempotent: true
      x-permission: logistics.pickup.manage
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [date],
                    properties: { date: { type: string, format: date }, slot: { type: string } },
                  },
              },
          }
      responses:
        '200': { description: Rescheduled pickup }
        '409': { $ref: '#/components/responses/Error' }
  /logistics/ndr:
    get:
      operationId: listSellerNdr
      x-permission: logistics.ndr.view
      responses: { '200': { description: Seller NDR queue with response deadlines } }
  /logistics/ndr/{ndrId}/respond:
    parameters: [{ name: ndrId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: respondToSellerNdr
      x-idempotent: true
      x-permission: logistics.ndr.respond
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [action],
                    properties:
                      {
                        action: { type: string, enum: [REATTEMPT, RTO] },
                        note: { type: string },
                        reason: { type: string },
                      },
                  },
              },
          }
      responses:
        '200': { description: Seller decision shared with admin and tracking }
        '409': { $ref: '#/components/responses/Error' }
  /logistics/rto:
    get:
      operationId: listSellerRto
      x-permission: logistics.rto.view
      responses: { '200': { description: Seller return-to-origin tracking } }
  /logistics/weight-disputes:
    get:
      operationId: listSellerWeightDisputes
      x-permission: logistics.weight_dispute.view
      responses: { '200': { description: Seller courier weight charges } }
  /logistics/weight-disputes/{disputeId}/dispute:
    parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: disputeSellerWeightCharge
      x-idempotent: true
      x-permission: logistics.weight_dispute.create
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [reason, evidence],
                    properties:
                      {
                        reason: { type: string },
                        evidence:
                          {
                            type: array,
                            minItems: 1,
                            items: { $ref: '#/components/schemas/MediaReference' },
                          },
                      },
                  },
              },
          }
      responses:
        '200': { description: Dispute submitted for admin resolution }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 200 },
      }
  requestBodies:
    Command:
      required: true
      description: Endpoint-specific command payload. Required fields and invariants are defined by the operation inventory and executable seller journey tests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Command' }
  schemas:
    Command:
      type: object
      description: A seller-scoped command. The authenticated principal supplies seller ownership; clients must never submit sellerId.
      additionalProperties: true
    PackageInput:
      type: object
      required: [itemIds, weightG, dimsCm]
      properties:
        itemIds: { type: array, minItems: 1, items: { type: string } }
        weightG: { type: number, exclusiveMinimum: 0 }
        dimsCm:
          type: object
          required: [l, w, h]
          properties:
            {
              l: { type: number, exclusiveMinimum: 0 },
              w: { type: number, exclusiveMinimum: 0 },
              h: { type: number, exclusiveMinimum: 0 },
            }
    LogisticsBatchRequest:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, enum: [GENERATE_DOCUMENTS, HANDOVER] }
        documentType: { type: string, enum: [TAX_INVOICE, PACKING_SLIP, SHIPPING_LABEL, MANIFEST] }
        ids: { type: array, minItems: 1, items: { type: string } }
    BulkOperation:
      type: string
      enum: [CREATE_PRODUCTS, ATTACH_OFFERS, UPDATE_PRICE, UPDATE_STOCK, UPDATE_CONTENT]
    BulkRequest:
      type: object
      required: [operation, rows]
      properties:
        operation: { $ref: '#/components/schemas/BulkOperation' }
        rows: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
    OfferInput:
      type: object
      required: [variantId, sellingPricePaise, mrpPaise, stock]
      properties:
        variantId: { type: string }
        sellerSku: { type: string }
        barcode: { type: string }
        taxCode: { type: string }
        sellingPricePaise: { type: integer, minimum: 1 }
        mrpPaise: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
    MediaReference:
      type: object
      required: [mediaId]
      properties:
        { mediaId: { type: string }, fileName: { type: string }, previewUrl: { type: string } }
    ApplicationSection:
      type: object
      required: [id, key, label, state]
      properties:
        id: { type: string }
        key: { type: string, enum: [business, tax, signatory, bank, pickup, agreement] }
        label: { type: string }
        state:
          {
            type: string,
            enum: [DRAFT, SUBMITTED, UNDER_REVIEW, CLARIFICATION_REQUIRED, REJECTED, APPROVED],
          }
        adminReason: { type: [string, 'null'] }
        correctiveAction: { type: [string, 'null'] }
    SellerApplication:
      type: object
      required: [id, sellerId, status, sections, documents]
      properties:
        id: { type: string }
        sellerId: { type: string }
        status:
          { type: string, enum: [DRAFT, UNDER_REVIEW, CLARIFICATION_REQUIRED, REJECTED, APPROVED] }
        sections: { type: array, items: { $ref: '#/components/schemas/ApplicationSection' } }
        documents: { type: array, items: { type: object, additionalProperties: true } }
        slaDueAt: { type: [string, 'null'], format: date-time }
        agreementAcceptance: { type: [object, 'null'], additionalProperties: true }
        events: { type: array, items: { type: object, additionalProperties: true } }
    VerifiedChangeRequest:
      type: object
      required: [proposedValue, reason]
      properties:
        proposedValue: { type: string, minLength: 2, maxLength: 200 }
        reason: { type: string, minLength: 2, maxLength: 2000 }
        evidenceMediaIds: { type: array, items: { type: string } }
    CreateMediaUpload:
      type: object
      required: [fileName, mimeType, sizeBytes, kind]
      properties:
        fileName: { type: string }
        mimeType:
          { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf, text/csv] }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        kind: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
    Crop:
      type: object
      required: [aspect]
      properties: { aspect: { type: string, enum: [original, square, '4:3', '16:9'] } }
    Media:
      type: object
      required: [id, fileName, mimeType, sizeBytes, status, previewUrl, downloadUrl, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        status:
          { type: string, enum: [AWAITING_UPLOAD, UPLOADED, PROCESSING, READY, FAILED, CANCELLED] }
        previewUrl: { type: string }
        downloadUrl: { type: string }
        crop: { oneOf: [{ $ref: '#/components/schemas/Crop' }, { type: 'null' }] }
        processingError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    CreateExport:
      type: object
      required: [resource]
      properties:
        resource: { type: string }
        label: { type: string }
        format: { type: string, enum: [CSV, XLSX] }
        estimatedRows: { type: integer, minimum: 0 }
        selection:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [SELECTED, FILTERED] }
            ids: { type: array, items: { type: string } }
            filters: { type: object, additionalProperties: true }
    Job:
      type: object
      required: [id, type, label, status, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        status:
          { type: string, enum: [QUEUED, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED] }
        progressPct: { type: integer, minimum: 0, maximum: 100 }
        resultUrl: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            {
              code: { type: string },
              message: { type: string },
              fieldErrors: { type: object, additionalProperties: true },
              details: { type: object, additionalProperties: true },
            }
  responses:
    Data:
      description: Seller-scoped resource using the standard data envelope.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: [object, array, 'null'] }
    Error:
      description: Standard error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UploadCreated:
      description: Upload session created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [uploadId, mediaId, uploadUrl, expiresAt]
                properties:
                  {
                    uploadId: { type: string },
                    mediaId: { type: string },
                    uploadUrl: { type: string },
                    expiresAt: { type: string, format: date-time },
                  }
    Media:
      description: Media resource
      content:
        {
          application/json:
            {
              schema:
                { type: object, properties: { data: { $ref: '#/components/schemas/Media' } } },
            },
        }
    Job:
      description: Export job
      content:
        {
          application/json:
            {
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Job' } } },
            },
        }
    Application:
      description: Seller application projection shared with admin review
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  properties: { data: { $ref: '#/components/schemas/SellerApplication' } },
                },
            },
        }

name: Android release APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: Ecommerce/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      # .env is gitignored; the whole file lives in the ENV_FILE secret.
      - run: printf '%s' "$ENV_FILE" > .env
        env: { ENV_FILE: "${{ secrets.ENV_FILE }}" }
      - run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
      - run: ./gradlew assembleRelease
        working-directory: Ecommerce/android
        env:
          ARISE_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.keystore
          ARISE_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ARISE_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ARISE_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: arise-release-apk
          path: Ecommerce/android/app/build/outputs/apk/release/*.apk

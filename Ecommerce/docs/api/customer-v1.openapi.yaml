  "components": {
    "securitySchemes": {
      "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" }
    },
    "parameters": {
      "Cursor": { "name": "cursor", "in": "query", "schema": { "type": ["string", "null"] } },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "minLength": 8, "maxLength": 200 } },
      "CategoryId": { "name": "categoryId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ProductId": { "name": "productId", "in": "path", "required": true, "schema": { "type": "string" } },
      "PromotionId": { "name": "promotionId", "in": "path", "required": true, "schema": { "type": "string" } },
      "CartItemId": { "name": "cartItemId", "in": "path", "required": true, "schema": { "type": "string" } },
      "AddressId": { "name": "addressId", "in": "path", "required": true, "schema": { "type": "string" } },
      "CheckoutSessionId": { "name": "checkoutSessionId", "in": "path", "required": true, "schema": { "type": "string" } },
      "PaymentId": { "name": "paymentId", "in": "path", "required": true, "schema": { "type": "string" } },
      "PaymentMethodId": { "name": "paymentMethodId", "in": "path", "required": true, "schema": { "type": "string" } },
      "OrderId": { "name": "orderId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ReturnId": { "name": "returnId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ShipmentId": { "name": "shipmentId", "in": "path", "required": true, "schema": { "type": "string" } },
      "NotificationId": { "name": "notificationId", "in": "path", "required": true, "schema": { "type": "string" } },
      "DeviceId": { "name": "deviceId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ReviewId": { "name": "reviewId", "in": "path", "required": true, "schema": { "type": "string" } },
      "QuestionId": { "name": "questionId", "in": "path", "required": true, "schema": { "type": "string" } },
      "TicketId": { "name": "ticketId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ArticleId": { "name": "articleId", "in": "path", "required": true, "schema": { "type": "string" } }
    },
    "requestBodies": {
      "JsonCommand": { "required": true, "content": { "application/json": { "schema": { "type": "object", "additionalProperties": true } } } }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": ["code", "message", "requestId"],
        "properties": {
          "code": { "type": "string" }, "message": { "type": "string" },
          "fieldErrors": { "type": ["object", "null"], "additionalProperties": { "type": "string" } },
          "details": { "type": ["object", "null"], "additionalProperties": true },
          "requestId": { "type": "string" }, "retryable": { "type": "boolean" }
        }
      },
      "ErrorEnvelope": { "type": "object", "required": ["error"], "properties": { "error": { "$ref": "#/components/schemas/Error" } } },
      "GenericObject": { "type": "object", "additionalProperties": true },
      "GenericEnvelope": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/GenericObject" }, "meta": { "type": "object", "additionalProperties": true } } },
      "GenericListEnvelope": { "type": "object", "required": ["data"], "properties": { "data": { "type": "object", "required": ["items"], "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/GenericObject" } }, "nextCursor": { "type": ["string", "null"] }, "total": { "type": "integer", "minimum": 0 } } } } },
      "Session": { "type": "object", "required": ["accessToken", "expiresAt", "user"], "properties": { "accessToken": { "type": "string" }, "refreshToken": { "type": ["string", "null"] }, "expiresAt": { "type": "string", "format": "date-time" }, "user": { "$ref": "#/components/schemas/GenericObject" } } },
      "Money": { "type": "object", "required": ["amountPaise", "currency"], "properties": { "amountPaise": { "type": "integer", "minimum": 0 }, "currency": { "const": "INR" } } },
      "OrderStatus": { "type": "string", "enum": ["PENDING_PAYMENT", "CONFIRMED", "PROCESSING", "PACKED", "READY_TO_SHIP", "SHIPPED", "IN_TRANSIT", "OUT_FOR_DELIVERY", "DELIVERED", "PAYMENT_FAILED", "DELIVERY_FAILED", "CANCELLED"] },
      "ReturnStatus": { "type": "string", "enum": ["REQUESTED", "APPROVED", "PICKUP_SCHEDULED", "PICKED_UP", "RECEIVED", "QC_PASSED", "QC_FAILED", "REJECTED", "REFUND_INITIATED", "REFUND_COMPLETED", "REPLACEMENT_SHIPPED", "CANCELLED"] },
      "RefundStatus": { "type": "string", "enum": ["NOT_REQUIRED", "PENDING", "PROCESSING", "SUCCEEDED", "FAILED"] },
      "PaymentStatus": { "type": "string", "enum": ["CREATED", "REQUIRES_ACTION", "PROCESSING", "SUCCEEDED", "FAILED", "CANCELLED", "UNKNOWN"] },
      "Payment": { "type": "object", "required": ["id", "checkoutSessionId", "method", "status", "amountPaise", "currency", "providerAction"], "properties": { "id": { "type": "string" }, "checkoutSessionId": { "type": "string" }, "method": { "type": "string", "enum": ["upi", "card", "cod", "wallet"] }, "status": { "$ref": "#/components/schemas/PaymentStatus" }, "amountPaise": { "type": "integer", "minimum": 0 }, "currency": { "const": "INR" }, "providerAction": { "type": "object", "required": ["type", "url"], "properties": { "type": { "type": "string", "enum": ["NONE", "REDIRECT", "UPI_INTENT", "SDK"] }, "url": { "type": ["string", "null"], "format": "uri" }, "returnUrl": { "type": ["string", "null"] } } } } },
      "Order": { "type": "object", "required": ["id", "placedAt", "status", "items", "totals", "canCancel", "canReturn"], "properties": { "id": { "type": "string" }, "placedAt": { "type": "string", "format": "date-time" }, "status": { "$ref": "#/components/schemas/OrderStatus" }, "items": { "type": "array", "minItems": 1, "items": { "$ref": "#/components/schemas/GenericObject" } }, "totals": { "$ref": "#/components/schemas/GenericObject" }, "canCancel": { "type": "boolean" }, "canReturn": { "type": "boolean" } } },
      "Product": { "type": "object", "required": ["id", "name", "brand", "imageUrl", "pricePaise", "mrpPaise", "available"], "properties": { "id": { "type": "string" }, "name": { "type": "string" }, "brand": { "type": "string" }, "imageUrl": { "type": "string", "format": "uri" }, "pricePaise": { "type": "integer", "minimum": 0 }, "mrpPaise": { "type": "integer", "minimum": 1 }, "available": { "type": "boolean" } } },
      "AppConfig": { "type": "object", "required": ["minimumSupportedVersion", "latestVersion", "maintenance", "storeUrls", "featureFlags"], "properties": { "minimumSupportedVersion": { "type": "string" }, "latestVersion": { "type": "string" }, "maintenance": { "type": "object", "required": ["enabled"], "properties": { "enabled": { "type": "boolean" }, "message": { "type": ["string", "null"] } } }, "storeUrls": { "type": "object", "required": ["android", "ios"], "properties": { "android": { "type": "string" }, "ios": { "type": "string" } } }, "featureFlags": { "type": "object", "additionalProperties": { "type": "boolean" } } } }
    },
    "responses": {
      "Error": { "description": "Normalized API error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "ValidationError": { "description": "Request validation failed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
      "Resource": { "description": "Resource envelope", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "Command": { "description": "Command result envelope", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "List": { "description": "Cursor-paginated collection", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericListEnvelope" } } } },
      "Health": { "description": "Service health", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "Session": { "description": "Authenticated session", "content": { "application/json": { "schema": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/Session" } } } } } },
      "AppConfig": { "description": "Runtime configuration", "content": { "application/json": { "schema": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/AppConfig" } } } } } },
      "Product": { "description": "Product", "content": { "application/json": { "schema": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/Product" } } } } } },
      "Cart": { "description": "Authoritative cart and totals", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "CheckoutSession": { "description": "Expiring authoritative quote", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "Payment": { "description": "Payment intent", "content": { "application/json": { "schema": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/Payment" } } } } } },
      "Order": { "description": "Order", "content": { "application/json": { "schema": { "type": "object", "required": ["data"], "properties": { "data": { "$ref": "#/components/schemas/Order" } } } } } },
      "Return": { "description": "Return request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } },
      "Wallet": { "description": "Non-withdrawable store-credit wallet", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GenericEnvelope" } } } }
    }
  }
}
